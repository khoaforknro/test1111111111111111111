<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Videos - Ke Sugar</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #e0f2fe;
      color: #1f2933;
      opacity: 0;
      transition: opacity .5s ease;
      user-select: none;
    }

    body.loaded { opacity: 1; }

    a { text-decoration: none; color: inherit; }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 30px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 999px;
      overflow: hidden;
      border: 3px solid #fff;
      background-color: #e0f2fe;
      box-shadow: 0 8px 20px rgba(56,189,248,0.25);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      max-width: 500px;
    }

    .nav-item {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4b5563;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-item::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg,#3b82f6,#0ea5e9);
      transition: width .3s ease;
    }

    .nav-item:hover::after { width: 100%; }

    /* PHẦN TRÊN */
    .video-intro {
      background-color: #fff;
      border-radius: 24px;
      padding: 30px 28px;
      box-shadow: 0 24px 60px rgba(56,189,248,0.18);
      border: 1px solid rgba(56,189,248,0.2);
      margin-bottom: 40px;
    }

    .video-intro h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .video-intro p {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 20px;
    }

    .video-upload-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .video-upload-box {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .video-upload-box video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* COMING SOON */
    .coming-soon {
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      color: #94a3b8;
      opacity: 0.5;
      padding: 40px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* PHẦN DƯỚI */
    .video-section {
      background-color: #0f172a;
      padding: 40px 28px;
      border-radius: 24px;
      color: #fff;
      margin-top: 40px;
    }

    /* ✅ HIỆU ỨNG CHỮ HIGHLIGHTS — PASTEL DRIFT */
    .pastel-drift {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 35px;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;

      background: linear-gradient(
        90deg,
        #7dd3fc,
        #a5b4fc,
        #f9a8d4,
        #fde68a,
        #7dd3fc
      );
      background-size: 300%;
      -webkit-background-clip: text;
      color: transparent;

      animation: drift 7s ease-in-out infinite;
      text-shadow: 0 0 5px rgba(255,255,255,0.25);
    }

    @keyframes drift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .video-item iframe {
      width: 100%;
      height: 315px;
      border-radius: 12px;
      border: none;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
    }

    @media (max-width: 900px) {
      .video-upload-row,
      .video-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<script>
  window.addEventListener("load", () => {
    document.body.classList.add("loaded");
  });
</script>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="brand-area">
      <div class="avatar-wrapper">
        <img src="https://iili.io/fIneulp.md.png" />
      </div>
      <div>
        <div class="brand-title">Ke Sugar</div>
        <div class="brand-subtitle">Photography & Videography Portfolio</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="index.html">MAIN</a>
      <a class="nav-item" href="about.html">ABOUT ME</a>
      <a class="nav-item" href="photos.html">PHOTOS</a>
      <a class="nav-item" href="cosplay.html">PHOTOS COSPLAY</a>
      <a class="nav-item" href="normal.html">NON-COSPLAY</a>
      <a class="nav-item" href="videos.html">VIDEOS</a>
      <a class="nav-item" href="service.html">SERVICE & CONTACT</a>
      <a class="nav-item" href="rules.html">RULES</a>
    </nav>
  </header>

  <!-- PHẦN TRÊN -->
  <section class="video-intro">
    <h1>VIDEOS</h1>
    <p>Video được upload từ nguồn khác (Drive / Dropbox / GitHub / Host riêng).</p>

    <div id="top-video-area" class="video-upload-row">
      <!-- ĐỂ TRỐNG NẾU CHƯA CÓ VIDEO -->
    </div>

    <div id="top-coming" class="coming-soon" style="display:none;">
      Coming Soon…
    </div>
  </section>

  <!-- PHẦN DƯỚI -->
  <section id="highlight-section" class="video-section">
    <h2 class="pastel-drift">HIGHLIGHTS</h2>

    <div id="highlight-grid" class="video-grid">
      <!-- ĐỂ TRỐNG NẾU CHƯA CÓ VIDEO -->
    </div>

    <div id="highlight-coming" class="coming-soon" style="display:none;">
      Coming Soon…
    </div>
  </section>

</div>

<script>
  // PHẦN TRÊN
  const topArea = document.querySelector("#top-video-area");
  const topComing = document.querySelector("#top-coming");

  if (topArea.children.length === 0) {
    topComing.style.display = "block";
  }

  // PHẦN DƯỚI
  const highlightGrid = document.querySelector("#highlight-grid");
  const highlightComing = document.querySelector("#highlight-coming");

  if (highlightGrid.children.length === 0) {
    highlightComing.style.display = "block";
  }
</script>

</body>
</html>
