<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Videos - Ke Sugar</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #e0f2fe;
      color: #1f2933;
      opacity: 0;
      transition: opacity .5s ease;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body.loaded { opacity: 1; }

    a { text-decoration: none; color: inherit; }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 30px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 999px;
      overflow: hidden;
      border: 3px solid #fff;
      background-color: #e0f2fe;
      box-shadow: 0 8px 20px rgba(56,189,248,0.25);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      max-width: 500px;
    }

    .nav-item {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4b5563;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-item::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg,#3b82f6,#0ea5e9);
      transition: width .3s ease;
    }

    .nav-item:hover::after { width: 100%; }

    /* PHẦN TRÊN */
    .video-intro {
      background-color: #fff;
      border-radius: 24px;
      padding: 30px 28px;
      box-shadow: 0 24px 60px rgba(56,189,248,0.18);
      border: 1px solid rgba(56,189,248,0.2);
      margin-bottom: 40px;
    }

    .video-intro h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .video-intro p {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 20px;
    }

    /* Video host ngoài */
    .video-upload-box {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .video-upload-box video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* PHẦN DƯỚI */
    .video-section {
      background-color: #0f172a;
      padding: 40px 28px;
      border-radius: 24px;
      color: #fff;
    }

    /* Glow đẹp cho HIGHLIGHTS */
    .video-section h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 35px;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #00eaff;
      text-shadow:
        0 0 10px rgba(0,255,255,0.8),
        0 0 20px rgba(0,200,255,0.7),
        0 0 35px rgba(0,150,255,0.6),
        0 0 55px rgba(0,255,255,0.5);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .video-item iframe {
      width: 100%;
      height: 315px;
      border-radius: 12px;
      border: none;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
    }

    @media (max-width: 900px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- ✅ BẢO MẬT FULL -->
<script>
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', e => {
    if (e.key === 'F12') e.preventDefault();
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) e.preventDefault();
    if (e.ctrlKey && ['U','S','P','A','C','X','V'].includes(e.key)) e.preventDefault();
  });

  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  document.addEventListener('paste', e => e.preventDefault());

  window.addEventListener("load", () => {
    document.body.classList.add("loaded");
  });
</script>

<div class="page">

      <a class="nav-item" href="normal.html">NON-COSPLAY</a>
      <a class="nav-item" href="videos.html">VIDEOS</a>
      <a class="nav-item" href="service.html">SERVICE & CONTACT</a>
      <a class="nav-item" href="rules.html">RULES</a>
    </nav>
  </header>

  <!-- PHẦN TRÊN: VIDEO HOST NGOÀI -->
  <section class="video-intro">

    <p>Video được upload từ nguồn khác (Drive / Dropbox / GitHub / Host riêng).</p>

    <div class="video-upload-box">

      </video>
    </div>
    <div class="video-upload-box">

      </video>
    </div>

  <!-- PHẦN DƯỚI: EMBED YOUTUBE -->
